# Cilium is the CNI. It needs host networking, host paths, host ports and
# extra capabilities to manage the node's network stack.
# Each exception lists only the policies that the component actually fails.
# Matching uses namespace plus labels, because generated pod names are not
# always known at admission time.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: cilium-agent
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: disallow-capabilities
    - kind: ValidatingPolicy
      name: disallow-host-namespaces
    - kind: ValidatingPolicy
      name: disallow-host-path
    - kind: ValidatingPolicy
      name: disallow-host-ports
    - kind: ValidatingPolicy
      name: disallow-privileged-containers
    - kind: ValidatingPolicy
      name: disallow-selinux
    - kind: ValidatingPolicy
      name: restrict-apparmor-profiles
    - kind: ValidatingPolicy
      name: restrict-seccomp
  matchConditions:
    - name: cilium-agent-in-kube-system
      expression: >-
        object.metadata.namespace == 'kube-system' &&
        has(object.metadata.labels) &&
        'app.kubernetes.io/name' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/name'] == 'cilium-agent'
  properties:
    reason: CNI agent requires privileged host access
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: cilium-envoy
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: disallow-capabilities
    - kind: ValidatingPolicy
      name: disallow-host-namespaces
    - kind: ValidatingPolicy
      name: disallow-host-path
    - kind: ValidatingPolicy
      name: disallow-host-ports
    - kind: ValidatingPolicy
      name: disallow-selinux
    - kind: ValidatingPolicy
      name: restrict-apparmor-profiles
  matchConditions:
    - name: cilium-envoy-in-kube-system
      expression: >-
        object.metadata.namespace == 'kube-system' &&
        has(object.metadata.labels) &&
        'app.kubernetes.io/name' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/name'] == 'cilium-envoy'
  properties:
    reason: Cilium L7 proxy runs in the host network namespace
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: cilium-operator
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: disallow-host-namespaces
    - kind: ValidatingPolicy
      name: disallow-host-ports
  matchConditions:
    - name: cilium-operator-in-kube-system
      expression: >-
        object.metadata.namespace == 'kube-system' &&
        has(object.metadata.labels) &&
        'app.kubernetes.io/name' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/name'] == 'cilium-operator'
  properties:
    reason: Cilium operator uses host networking
---
# The cilium-install Job comes from the Talos inline manifest that
# bootstraps Cilium before any CNI exists, so it must use host networking.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: cilium-install
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: disallow-host-namespaces
  matchConditions:
    - name: cilium-install-job-in-kube-system
      expression: >-
        object.metadata.namespace == 'kube-system' &&
        has(object.metadata.labels) &&
        'app' in object.metadata.labels &&
        object.metadata.labels['app'] == 'cilium-install'
  properties:
    reason: Talos bootstrap job installs the CNI from the host network
