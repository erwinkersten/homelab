# The Proxmox CSI node plugin mounts volumes on the host, so it needs
# privileged mode, host paths and SYS_ADMIN.
# Only the node plugin is excepted, not the controller. The DaemonSet itself
# has no component label, so it is matched by kind instead.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: proxmox-csi-node
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: disallow-capabilities
    - kind: ValidatingPolicy
      name: disallow-host-path
    - kind: ValidatingPolicy
      name: disallow-privileged-containers
  matchConditions:
    - name: proxmox-csi-node-plugin
      expression: >-
        object.metadata.namespace == 'csi-proxmox' &&
        has(object.metadata.labels) &&
        'app.kubernetes.io/name' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/name'] == 'proxmox-csi-plugin' &&
        (
          object.kind == 'DaemonSet' ||
          (
            'app.kubernetes.io/component' in object.metadata.labels &&
            object.metadata.labels['app.kubernetes.io/component'] == 'node'
          )
        )
  properties:
    reason: CSI node plugin mounts volumes on the host
